<script>
/* ============================================================
   저장소 — 실서비스는 이 두 함수만 Supabase 호출로 교체
   ============================================================ */
/* ★★★ 여기 두 줄만 채우면 실서비스로 전환됩니다 ★★★
   Supabase → Project Settings → API 에서 복사
   비워두면 '데모 모드'로 돌아갑니다 (새로고침하면 데이터 사라짐) */
const SUPABASE_URL = 'https://mscjvtgcdndkymscoznt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s2MhFgqTmajU_bMhFQxRvg_Yitc3zTN';

const LIVE = !!(SUPABASE_URL && SUPABASE_KEY);
const sb   = LIVE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ---------- 쿠키 (이 브라우저 기억 · 1년) ---------- */
const cookie = {
  get(k){
    const m = document.cookie.match('(^|; )' + k + '=([^;]*)');
    return m ? decodeURIComponent(m[2]) : null;
  },
  set(k, v){
    document.cookie = k + '=' + encodeURIComponent(v) +
      '; max-age=31536000; path=/; SameSite=Lax';
  },
  del(k){ document.cookie = k + '=; max-age=0; path=/'; }
};

/* ---------- 이 브라우저 고유 투표자 키 (중복 투표 방지) ---------- */
function voterKey(){
  let v = cookie.get('mm_voter');
  if(!v){
    v = (crypto.randomUUID ? crypto.randomUUID()
         : String(Date.now()) + Math.random().toString(36).slice(2));
    cookie.set('mm_voter', v);
  }
  return v;
}

/* ---------- 데모 모드용 임시 저장소 (새로고침하면 사라짐) ---------- */
const demoDB = {};

/* ---------- 데이터 접근 ----------
   room 모양: { nick, mbti, n, t }
   n = 참여자 수, t = 4축 집계 [{pa,pb,win}, ...]              */
const api = {
  async exists(nick){
    if(!LIVE) return !!demoDB[nick.toLowerCase()];
    const { data } = await sb.from('users').select('nick')
      .eq('nick_lower', nick.toLowerCase()).maybeSingle();
    return !!data;
  },

  async create(nick, mbti){
    if(!LIVE){ demoDB[nick.toLowerCase()] = { nick, mbti, votes: [] }; return; }
    const { error } = await sb.from('users')
      .insert({ nick, nick_lower: nick.toLowerCase(), mbti });
    if(error) throw error;
  },

  async result(nick){
    if(!LIVE){
      const r = demoDB[nick.toLowerCase()];
      if(!r) return null;
      return { nick: r.nick, mbti: r.mbti, n: r.votes.length, t: tally(r.votes) };
    }
    const { data } = await sb.rpc('get_result', { p_nick: nick });
    if(!data) return null;
    const raw = [data.e, data.s, data.t, data.j];
    return {
      nick: data.nick, mbti: data.mbti, n: data.n,
      t: AXES.map((x, i) => {
        const pa = data.n ? Math.round(raw[i] / data.n * 100) : 0;
        return { pa, pb: 100 - pa, win: pa >= 50 ? x.a : x.b };
      })
    };
  },

  async vote(nick, guess){
    if(!LIVE){ (demoDB[nick.toLowerCase()] || {votes:[]}).votes.push(guess); return; }
    const { error } = await sb.from('votes').insert({
      nick_lower: nick.toLowerCase(), guess, voter_key: voterKey()
    });
    if(error && error.code !== '23505') throw error;   /* 23505 = 중복 투표 */
  }
};

/* ============================================================
   데이터
   ============================================================ */
const AXES = [
  {name:'에너지 방향', a:'E', b:'I', ad:'밖에서 충전', bd:'혼자서 충전'},
  {name:'인식 방식',  a:'S', b:'N', ad:'현실·감각',   bd:'상상·직관'},
  {name:'판단 기준',  a:'T', b:'F', ad:'논리·팩트',   bd:'감정·공감'},
  {name:'생활 양식',  a:'J', b:'P', ad:'계획대로',     bd:'그때그때'}
];
const GAP = {
  EI:'밖에선 활활 타는 줄 알았는데, 친구들은 당신의 조용한 뒷모습을 봤나 봐요.',
  IE:'집돌이·집순이라 우기시지만 친구들 판정은 이미 인싸 확정입니다.',
  SN:'현실주의자라면서요? 친구들은 당신 머릿속 우주를 이미 구경했대요.',
  NS:'머릿속은 은하계인데, 친구들은 당신을 현실 해결사로 믿고 있어요.',

/* ---------- 링크 공유 ----------
   카카오 SDK의 '앱 메시지'는 PC 카톡에서 열리지 않고
   "모바일에서 확인해 주세요"로 막힌다.
   그래서 OS 공유 시트로 생 URL을 보낸다.
   받는 사람은 어디서든 바로 눌리는 평범한 링크를 받고,
   카톡이 og 태그를 읽어 썸네일 카드를 알아서 붙여준다. */
async function shareLink(nick, url){
  if(!navigator.share) return false;
  const title = shareMsg(nick);
  try{
    await navigator.share({ title, text: title, url });
    return true;
  }catch(e){
    if(e && e.name === 'AbortError') return true;   /* 사용자가 취소 */
    console.error(e);
    return false;
  }
}

/* ---------- 결과 이미지 만들기 ---------- */
function rr(x, a, b, w, h, r){
  x.beginPath();
  x.moveTo(a+r, b); x.lineTo(a+w-r, b); x.quadraticCurveTo(a+w, b, a+w, b+r);
  x.lineTo(a+w, b+h-r); x.quadraticCurveTo(a+w, b+h, a+w-r, b+h);
  x.lineTo(a+r, b+h); x.quadraticCurveTo(a, b+h, a, b+h-r);
  x.lineTo(a, b+r); x.quadraticCurveTo(a, b, a+r, b); x.closePath();
}

function wrap(x, text, cx, y, maxW, lh){
  const words = text.split(' '); let line = ''; const lines = [];
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(x.measureText(t).width > maxW && line){ lines.push(line); line = w; }
    else line = t;
  }
  if(line) lines.push(line);
  lines.forEach((l, i) => x.fillText(l, cx, y + i * lh));
  return lines.length * lh;
}

async function buildResultCanvas(){
  const g = mbtiOf(S.guess), my = S.room.mbti, nk = S.nick;
  const hit = [0,1,2,3].filter(i => g[i] === my[i]).length;
  const W = 1080, H = 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  try{ await document.fonts.ready; }catch(e){}
  const FF = "Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
  const INK='#191233', SOFT='#6B6390', ME='#00BFA6', THEM='#FF3D7F';

  x.fillStyle = '#EFEDFF'; x.fillRect(0,0,W,H);
  x.fillStyle = '#DEDBF5';
  for(let yy=0; yy<H; yy+=54) for(let xx=0; xx<W; xx+=54){ x.beginPath(); x.arc(xx,yy,3,0,6.3); x.fill(); }

  x.textAlign = 'center';
  x.fillStyle = SOFT; x.font = '800 30px ' + FF;
  x.fillText('남들이 보는 내 MBTI는?', W/2, 128);
  x.fillStyle = INK; x.font = '900 62px ' + FF;
  x.fillText('내가 본 ' + nk + '님', W/2, 210);

  const cw=380, ch=250, gap=60, cy=320, x0=(W-(cw*2+gap))/2;
  const card = (px, tag, val, col) => {
    x.fillStyle = '#fff'; rr(x, px, cy, cw, ch, 34); x.fill();
    x.strokeStyle = col; x.lineWidth = 8; rr(x, px, cy, cw, ch, 34); x.stroke();
    x.fillStyle = col; x.font = '800 28px ' + FF;
    x.fillText(tag, px+cw/2, cy+72);
    x.fillStyle = INK; x.font = '900 92px ' + FF;
    x.fillText(val, px+cw/2, cy+176);
  };
  card(x0, '내 추측', g, THEM);
  card(x0+cw+gap, nk + '님의 답', my, ME);
  x.fillStyle = SOFT; x.font = '900 34px ' + FF;
  x.fillText('VS', W/2, cy+ch/2+12);

  x.fillStyle = INK; x.font = '900 130px ' + FF;
  x.fillText(hit + ' / 4', W/2, 760);
  x.fillStyle = SOFT; x.font = '800 32px ' + FF;
  x.fillText('적중', W/2, 812);

  x.fillStyle = INK; rr(x, 70, 880, W-140, 230, 36); x.fill();
  x.fillStyle = '#fff'; x.font = '800 38px ' + FF;
  wrap(x, REVEAL[hit], W/2, 960, W-240, 56);

  x.fillStyle = SOFT; x.font = '700 28px ' + FF;
  x.fillText(location.host + (IS_PAGES ? BASE : '/'), W/2, 1250);
  return c;
}

async function saveResultImage(){
  const c = await buildResultCanvas();
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if(!blob) return toast('이미지를 만들지 못했어요');
  const file = new File([blob], 'my-mbti-result.png', { type: 'image/png' });
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{ await navigator.share({ files: [file] }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = 'my-mbti-result.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 3000);
  toast('이미지를 저장했어요');
}

    return {pa, pb:100-pa, win: pa>=50 ? x.a : x.b};
  });
}

function stampBars(t, owner, yours, tag){
  const T = tag || '내 답';
  return t.map((x,i)=>{
    const A = AXES[i];
    const aOwner = owner[i] === A.a;
    const dot = side => (yours && yours[i] === side) ? '<span class="ydot">●</span>' : '';
    const chip = `<span class="owntag">${T}</span>`;
    return `
    <div class="drow">
      <div class="dhead">
        <span class="${aOwner?'own':'dim'}">${dot(A.a)}<span class="L">${A.a}</span><span class="pc">${x.pa}%</span>${aOwner?chip:''}</span>
        <span class="${aOwner?'dim':'own'}">${aOwner?'':chip}<span class="pc">${x.pb}%</span><span class="L">${A.b}</span>${dot(A.b)}</span>
      </div>
      <div class="dtrack">
        <div class="dbar l" data-w="${x.pa/2}" style="background:${aOwner?'var(--me)':'var(--them)'}"></div>
        <div class="dbar r" data-w="${x.pb/2}" style="background:${aOwner?'var(--them)':'var(--me)'}"></div>
        <div class="mid"></div>
      </div>
    </div>`;
  }).join('');
}

        ${CAN_SHARE ? '<button class="btn kakao" id="kshare">친구들에게 링크 보내기</button>' : ''}
        <div class="linkbox"><code>${link(nk)}</code><button class="copy" id="cp">링크 복사</button></div>
        <button class="btn ghost" data-go="home">처음으로</button>
      </div>
    </div>`;
  }
  const friendMbti = t.map(x=>x.win).join('');
  const gapCount = t.filter((x,i)=> x.win !== my[i]).length;
  const detail = t.map((x,i)=> x.win!==my[i] ? GAP[my[i]+x.win] : SAME[my[i]]);

  return `
  <div class="pad">
    <span class="eyebrow">@${nk} 의 인식 격차 리포트</span>
    <div class="count" style="margin-top:10px"><span class="n mono">${n}</span><span class="u">명이 나를 찍었습니다</span></div>
    <button class="btn ghost sm" id="refresh" style="margin-top:12px">새로고침 · 새로 들어온 표 확인</button>
    <div class="facepair">
      <div class="face me flip"><div class="tag">내가 아는 나</div><div class="val">${my}</div></div>
      <div class="vs">VS</div>
      <div class="face them flip"><div class="tag">친구들이 본 나</div><div class="val">${friendMbti}</div></div>
    </div>
  </div>
  <div class="quote" style="margin-top:18px">
    <div class="m">${HEADLINE[gapCount]}</div>
    <div class="sub">4개 중 ${4-gapCount}개 일치 · ${gapCount}개 엇갈림</div>
  </div>
  <div class="card" style="margin-top:18px">
    <h3 style="margin-bottom:12px">항목별 득표</h3>
    ${stampBars(t, my, null, '내 답')}
    ${AXFOOT}
  </div>
  ${AD_RESULT()}
  <div class="card">
    <h3>친구들의 채점평</h3>
    ${detail.map(d=>`<p style="margin-top:9px;color:var(--ink)">· ${d}</p>`).join('')}
  </div>
  ${AD_REPORT()}
  <div class="stack" style="margin-top:18px">
    ${CAN_SHARE ? '<button class="btn kakao" id="kshare">링크 더 보내서 표 모으기</button>' : ''}
    <div class="linkbox"><code>${link(nk)}</code><button class="copy" id="cp">링크 복사</button></div>
    <button class="btn ghost" data-go="home">처음으로</button>
  </div>
  `;
}

function viewLookup(){
  return `<div class="pad">
    <h2>닉네임으로 열기</h2>
    <p style="margin-top:6px">비밀번호 없습니다. 만들 때 쓴 닉네임만 넣으세요.</p>
    <div class="nickfield" style="margin-top:18px">
      <span class="at">@</span>
      <input id="mynick" maxlength="12" autocomplete="off" placeholder="고릴라386">
    </div>
    <button class="btn" id="dolookup" style="margin-top:18px">결과 열기</button>
    <button class="btn ghost" data-go="home" style="margin-top:10px">처음으로</button>
  </div>
  `;
}

function viewGuess(){
  const nk = esc(S.nick), done = mbtiOf(S.guess).length===4;
  return `
  <div class="pad">
    <span class="eyebrow">친구 추측 모드</span>
    <h2 style="margin-top:8px">${nk}님은<br>어떤 사람일 것 같나요?</h2>
    <p style="margin-top:6px">4개를 다 고르면 ${nk}님이 적어둔 실제 답이 바로 공개됩니다.</p>
    <div class="card" style="margin-top:18px">${axisPicker(S.guess,'gs')}</div>
    <button class="btn pink" id="submit" style="margin-top:18px" ${done?'':'disabled'}>
      ${done? mbtiOf(S.guess)+'! 정답 확인하기' : '4개 항목을 모두 골라주세요'}</button>
  </div>
  <button class="btn ghost" data-go="home" style="margin-top:10px">처음으로</button>
  `;
}

function viewReveal(){
  const g = mbtiOf(S.guess), my = S.room.mbti, nk = esc(S.nick);
  const hit = [0,1,2,3].filter(i=>g[i]===my[i]).length;
  const diffs = [0,1,2,3].filter(i=>g[i]!==my[i]);
  const n = S.room.n, t = S.room.t;

  return `
  <div class="pad center">
    <span class="eyebrow">결과 공개</span>
    <h2 style="margin-top:8px">당신은 ${nk}님을 이렇게 봤는데,<br>${nk}님은 스스로를 이렇게 생각했대요!</h2>
    <div class="facepair">
      <div class="face them flip"><div class="tag">당신의 추측</div><div class="val">${g}</div></div>
      <div class="vs">VS</div>
      <div class="face me flip"><div class="tag">${nk}님의 진짜 답</div><div class="val">${my}</div></div>
    </div>
  </div>
  <div class="quote" style="margin-top:16px">
    <div class="m">${REVEAL[hit]}</div>
    <div class="sub">${hit}개 적중${diffs.length?' · 갈린 지점: '+diffs.map(i=>`${AXES[i].name}(당신 ${g[i]} / 본인 ${my[i]})`).join(', '):''}</div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="margin-bottom:12px">지금까지 ${n}명은 이렇게 봤어요</h3>
    ${stampBars(t, my, g, nk.length<=4 ? nk : '정답')}
    ${AXFOOT}
    <p class="note" style="margin-top:14px">채점평과 전체 리포트는 ${nk}님만 볼 수 있어요.</p>
  </div>
  <button class="btn ghost" id="rsave" style="margin-top:16px">결과 이미지로 공유하기</button>
  <div class="card" style="border-color:var(--them);margin-top:16px">
    <h3 style="color:var(--them)">그럼 당신은요?</h3>
    <p style="margin-top:8px">${nk}님을 이렇게 본 당신, 친구들은 당신을 어떻게 볼까요.
      닉네임 하나만 정하면 30초 만에 확인됩니다.</p>
    <button class="btn pink" data-go="nick" style="margin-top:14px">내 테스트 만들기</button>
  </div>
  ${AD_REVEAL()}`;
}

function viewModal(){
  const q = QUIZ[S.qi];
  return `<div class="modal"><div class="sheet">
    <div class="qprog"><i style="width:${S.qi/QUIZ.length*100}%"></i></div>
    <span class="eyebrow">${S.qi+1} / ${QUIZ.length}</span>
    <h2 style="margin-top:10px">${q[1]}</h2>
    <button class="qopt" data-pick="1">${q[2]}</button>
    <button class="qopt" data-pick="-1">${q[3]}</button>
    <div class="center"><button class="linkbtn" id="closeq" style="margin-top:16px">그만두기</button></div>
  </div></div>`;
}

/* ============================================================
   렌더
   ============================================================ */
const VIEWS = {home:viewHome, nick:viewNick, setup:viewSetup, share:viewShare,
               result:viewResult, lookup:viewLookup, guess:viewGuess, reveal:viewReveal};

function render(){
  app.innerHTML = VIEWS[S.screen]() + (S.modal ? viewModal() : '');
  window.scrollTo(0,0);
  requestAnimationFrame(()=>{
    document.querySelectorAll('.fill,.dbar').forEach(f=> f.style.width = f.dataset.w + '%');
  });
  const ni = document.getElementById('nick');
  if(ni) ni.addEventListener('input', ()=>{
    S.nick = ni.value.trim(); S.hint = '';
    const ok = NICK_RE.test(S.nick);
    const b = document.getElementById('nicknext');
    b.disabled = !ok;
    b.textContent = ok ? `@${S.nick} 로 시작하기` : '닉네임을 입력해주세요';
    const h = document.querySelector('.hint');
    h.className = 'hint ' + (ok?'ok':'');
    h.innerHTML = ok ? `친구들에겐 &lsquo;${esc(S.nick)}님의 MBTI를 맞혀보세요&rsquo;로 나갑니다`
                     : '한글·영문·숫자 2~12자. 띄어쓰기와 특수문자는 빼주세요.';
  });
  if(S.screen==='home') rotateHero();
  loadAds();
}

let heroTimer;
function rotateHero(){
  clearInterval(heroTimer);
  const pairs=[['INFJ','ENFP'],['ISTP','ENTJ'],['ENFP','INFP'],['ISFJ','ESFP']];
  let k=0;
  heroTimer=setInterval(()=>{
    const f1=document.getElementById('f1'), f2=document.getElementById('f2');
    if(!f1){clearInterval(heroTimer);return}
    k=(k+1)%pairs.length;
    f1.textContent=pairs[k][0]; f2.textContent=pairs[k][1];
    [f1,f2].forEach(e=>{e.parentElement.classList.remove('flip');void e.offsetWidth;e.parentElement.classList.add('flip')});
  },1900);
}
const go = s => { S.screen=s; render(); };

async function loadUser(nick){
  let r = null;
  try{ r = await api.result(nick); }catch(e){ console.error(e); toast('서버 연결에 문제가 있어요'); }
  if(!r) return false;
  S.nick = r.nick; S.room = r;
  S.mine = {}; [...r.mbti].forEach((c,i)=>S.mine[i]=c);
  return true;
}

/* ============================================================
   이벤트
   ============================================================ */
app.addEventListener('click', async e=>{
  const el = e.target.closest('[data-go],[data-me],[data-gs],[data-pick],[data-fill],button');
  if(!el) return;
  const id = el.id;

  if(el.dataset.fill){ S.nick = el.dataset.fill; S.hint=''; return render(); }

  if(el.dataset.go){
    if(el.dataset.go==='nick'){ S.mine={}; S.hint=''; S.nick=''; }
    if(el.dataset.go==='guess'){ S.guess={}; }
    return go(el.dataset.go);
  }
  if(el.dataset.me!==undefined){ S.mine[+el.dataset.me]=el.dataset.v; return render(); }
  if(el.dataset.gs!==undefined){ S.guess[+el.dataset.gs]=el.dataset.v; return render(); }

  if(id==='dunno'){ S.modal=true; S.qi=0; S.qs=[0,0,0,0]; return render(); }
  if(id==='closeq'){ S.modal=false; return render(); }
  if(el.dataset.pick){
    S.qs[QUIZ[S.qi][0]] += (+el.dataset.pick);
    if(++S.qi>=QUIZ.length){
      AXES.forEach((x,i)=> S.mine[i] = S.qs[i]>=0 ? x.a : x.b);
      S.modal=false; render(); toast('결과: '+mbtiOf(S.mine)+' — 마음에 안 들면 바꿔도 돼요');
      return;
    }
    return render();
  }

  if(id==='rsave'){
    el.disabled = true; toast('이미지를 만드는 중...');
    try{ await saveResultImage(); }catch(err){ console.error(err); toast('이미지를 만들지 못했어요'); }
    el.disabled = false; return;
  }

  if(id==='refresh'){
    el.disabled = true;
    const before = S.room ? S.room.n : 0;
    if(!(await loadUser(S.nick))){ el.disabled=false; return toast('불러오지 못했어요'); }
    render();
    const gained = S.room.n - before;
    return toast(gained > 0 ? `새로 ${gained}명이 참여했어요` : '아직 새로 들어온 표가 없어요');
  }

  if(id==='nicknext'){
    if(!NICK_RE.test(S.nick)) return;
    if(await api.exists(S.nick)){
      S.hint = `@${S.nick} 은 이미 쓰는 사람이 있어요. 뒤에 숫자를 붙여보세요.`;
      return render();
    }
    return go('setup');
  }

  if(id==='create'){
    el.disabled = true;
    try{ await api.create(S.nick, mbtiOf(S.mine)); }
    catch(err){ el.disabled=false; return toast('만들지 못했어요. 잠시 후 다시 시도해주세요.'); }
    await loadUser(S.nick);
    return go('share');
  }

  if(id==='kshare'){
    const url = shareUrl(S.nick);
    if(await shareLink(S.nick, url)) return;
    try{ await navigator.clipboard.writeText(shareMsg(S.nick) + '\n' + url); }catch(err){}
    return toast('문구와 링크를 복사했어요 · 카톡에 붙여넣어 주세요');
  }

  if(id==='cp'){
    const msg = shareMsg(S.nick) + '\n' + shareUrl(S.nick);
    try{ await navigator.clipboard.writeText(msg); }catch(err){}
    return toast('문구와 링크를 복사했어요');
  }

  if(id==='dolookup'){
    const v=(document.getElementById('mynick').value||'').trim();
    if(!v) return toast('닉네임을 넣어주세요');
    if(!(await loadUser(v))) return toast(`@${v} 로 만든 테스트가 없어요.`);
    return go(S.room.n ? 'result' : 'share');
  }

  if(id==='submit'){
    el.disabled = true;
    try{ await api.vote(S.nick, mbtiOf(S.guess)); }
    catch(err){ el.disabled=false; return toast('투표를 저장하지 못했어요. 다시 눌러주세요.'); }
    await loadUser(S.nick);
    return go('reveal');
  }
});

/* ---------- 부팅 ----------
   주소에 닉네임이 실려 있으면 친구 추측 화면, 아니면 첫 화면 */
(async function boot(){
  if(!LIVE){
    const f = document.createElement('div');
    f.className = 'demoflag';
    f.textContent = '데모 모드 · 저장되지 않습니다';
    document.body.appendChild(f);
  }

  let urlNick = new URLSearchParams(location.search).get('u') || '';
  if(!urlNick && !IS_PAGES){
    const m = location.pathname.match(/^\/@?([^\/]+)\/?$/);
    if(m) urlNick = decodeURIComponent(m[1]);
  }
  urlNick = urlNick.trim();

  if(urlNick){
    if(await loadUser(urlNick)){
      S.guess = {}; S.screen = 'guess'; render(); return;
    }
    toast(`@${urlNick} 를 찾지 못했어요`);
  }

  render();
})();
</script>
