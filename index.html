const cookie = {
  get(k){
    const m = document.cookie.match('(^|; )' + k + '=([^;]*)');
    return m ? decodeURIComponent(m[2]) : null;
  },
  set(k, v){
    document.cookie = k + '=' + encodeURIComponent(v) +

  del(k){ document.cookie = k + '=; max-age=0; path=/'; }
};

/* ---------- 이 브라우저 고유 투표자 키 (중복 투표 방지) ---------- */
function voterKey(){
  let v = cookie.get('mm_voter');
  if(!v){
    v = (crypto.randomUUID ? crypto.randomUUID()
         : String(Date.now()) + Math.random().toString(36).slice(2));
    cookie.set('mm_voter', v);
  }
  return v;
}

/* ---------- 데모 모드용 임시 저장소 (새로고침하면 사라짐) ---------- */

   room 모양: { nick, mbti, n, t }
   n = 참여자 수, t = 4축 집계 [{pa,pb,win}, ...]              */
const api = {
  async exists(nick){
    if(!LIVE) return !!demoDB[nick.toLowerCase()];
    const { data } = await sb.from('users').select('nick')
      .eq('nick_lower', nick.toLowerCase()).maybeSingle();
    return !!data;
  },

  async create(nick, mbti){
    if(!LIVE){ demoDB[nick.toLowerCase()] = { nick, mbti, votes: [] }; return; }
    const { error } = await sb.from('users')
      .insert({ nick, nick_lower: nick.toLowerCase(), mbti });
    if(error) throw error;
  },

  async result(nick){
    if(!LIVE){
      const r = demoDB[nick.toLowerCase()];
      if(!r) return null;
      return { nick: r.nick, mbti: r.mbti, n: r.votes.length, t: tally(r.votes) };
    }
    const { data } = await sb.rpc('get_result', { p_nick: nick });
    if(!data) return null;
    const raw = [data.e, data.s, data.t, data.j];
    return {
      nick: data.nick, mbti: data.mbti, n: data.n,
      t: AXES.map((x, i) => {
        const pa = data.n ? Math.round(raw[i] / data.n * 100) : 0;
        return { pa, pb: 100 - pa, win: pa >= 50 ? x.a : x.b };
      })
    };
  },

  async vote(nick, guess){
    if(!LIVE){ (demoDB[nick.toLowerCase()] || {votes:[]}).votes.push(guess); return; }
    const { error } = await sb.from('votes').insert({
      nick_lower: nick.toLowerCase(), guess, voter_key: voterKey()
    });
    if(error && error.code !== '23505') throw error;   /* 23505 = 중복 투표 */

function kakaoReady(){
  if(!KAKAO_JS_KEY || !window.Kakao) return false;
  if(!Kakao.isInitialized()){
    try{ Kakao.init(KAKAO_JS_KEY); }catch(e){ return false; }
  }
  return Kakao.isInitialized();
}

function kakaoShare(nick, url){
  if(!kakaoReady()) return false;
  const title = nick + '님의 MBTI를 맞혀보세요';
  const desc  = '고르는 순간 ' + nick + '님의 실제 답이 공개됩니다. 30초 컷.';
  const link  = { mobileWebUrl: url, webUrl: url };
  try{
    if(KAKAO_IMAGE){
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: { title, description: desc, imageUrl: KAKAO_IMAGE, link },
        buttons: [{ title: '맞히러 가기', link }]
      });
    }else{
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: title + '\n' + desc,
        link,
        buttonTitle: '맞히러 가기'
      });
    }
    return true;
  }catch(e){ console.error(e); return false; }
}

function tally(votes){
  return AXES.map((x,i)=>{
    const a = votes.filter(v=>v[i]===x.a).length;
    const pa = votes.length? Math.round(a/votes.length*100):0;
    return {pa, pb:100-pa, win: pa>=50 ? x.a : x.b};
  });
}

/* ---------- A안 도장 바 (결과·친구통계 공용) ----------
   owner : 퀴즈 낸 사람이 고른 4글자 (초록 도장)
   tag   : 도장에 찍힐 라벨
   yours : 보는 사람이 고른 4글자 (분홍 점). 없으면 생략
   showTag : 일치/엇갈림 칩 표시 여부                        */
function stampBars(t, owner, tag, yours, showTag){
  return t.map((x,i)=>{
    const A = AXES[i];
    const cls = side => [
      owner[i]===side ? 'mine' : '',
      yours && yours[i]===side ? 'yours' : ''
    ].join(' ').trim();
    const gap = x.win !== owner[i];
    return `
    <div class="arow">
      <div class="arowhead">
        <span class="axname">${A.name}</span>
        ${showTag ? `<span class="tagline ${gap?'gap':'same'}">${gap?'엇갈림':'일치'}</span>` : ''}
      </div>
      <div class="abody">
        <div class="achip ${cls(A.a)}" data-tag="${tag}">${A.a}</div>
        <div class="atrack"><div class="fill" data-w="${x.pa}"></div></div>
        <div class="achip ${cls(A.b)}" data-tag="${tag}">${A.b}</div>
      </div>
      <div class="anums">
        <span class="${x.win===A.a?'win':''}">${x.pa}%</span>
        <span class="${x.win===A.b?'win':''}">${x.pb}%</span>
      </div>
    </div>`;
  }).join('');
}

    <div class="legend"><span><i style="background:#00BFA6"></i>${nk}님이 고른 답</span>
      <span><i style="background:#FF3D7F"></i>당신이 고른 답</span></div>
    ${stampBars(t, my, tag, g, false)}
    <p class="note" style="margin-top:14px">채점평과 전체 리포트는 ${nk}님만 볼 수 있어요.</p>
  </div>
  ${AD_REVEAL()}
  <div class="card" style="border-color:var(--them)">
    <h3 style="color:var(--them)">그럼 당신은요?</h3>
    <p style="margin-top:8px">${nk}님을 이렇게 본 당신, 친구들은 당신을 어떻게 볼까요.
      닉네임 하나만 정하면 30초 만에 확인됩니다.</p>
    <button class="btn pink" data-go="nick" style="margin-top:14px">내 테스트 만들기</button>
  </div>`;
}

function viewModal(){
  const q = QUIZ[S.qi];
  return `<div class="modal"><div class="sheet">
    <div class="qprog"><i style="width:${S.qi/QUIZ.length*100}%"></i></div>
    <span class="eyebrow">${S.qi+1} / ${QUIZ.length}</span>
    <h2 style="margin-top:10px">${q[1]}</h2>
    <button class="qopt" data-pick="1">${q[2]}</button>
    <button class="qopt" data-pick="-1">${q[3]}</button>
    <div class="center"><button class="linkbtn" id="closeq" style="margin-top:16px">그만두기</button></div>
  </div></div>`;
}

/* ============================================================
   렌더
   ============================================================ */
const VIEWS = {home:viewHome, nick:viewNick, setup:viewSetup, share:viewShare,
               result:viewResult, lookup:viewLookup, guess:viewGuess, reveal:viewReveal};

function render(){
  app.innerHTML = VIEWS[S.screen]() + (S.modal ? viewModal() : '');
  window.scrollTo(0,0);
  requestAnimationFrame(()=>{
    document.querySelectorAll('.fill').forEach(f=> f.style.width = f.dataset.w + '%');
  });
  const ni = document.getElementById('nick');
  if(ni) ni.addEventListener('input', ()=>{
    S.nick = ni.value.trim(); S.hint = '';
    const ok = NICK_RE.test(S.nick);
    const b = document.getElementById('nicknext');
    b.disabled = !ok;
    b.textContent = ok ? `@${S.nick} 로 시작하기` : '닉네임을 입력해주세요';
    const h = document.querySelector('.hint');
    h.className = 'hint ' + (ok?'ok':'');
    h.innerHTML = ok ? `친구들에겐 &lsquo;${esc(S.nick)}님의 MBTI를 맞혀보세요&rsquo;로 나갑니다`
                     : '한글·영문·숫자 2~12자. 띄어쓰기와 특수문자는 빼주세요.';
  });
  if(S.screen==='home') rotateHero();
  loadAds();
}

let heroTimer;
function rotateHero(){
  clearInterval(heroTimer);
  const pairs=[['INFJ','ENFP'],['ISTP','ENTJ'],['ENFP','INFP'],['ISFJ','ESFP']];
  let k=0;
  heroTimer=setInterval(()=>{
    const f1=document.getElementById('f1'), f2=document.getElementById('f2');
    if(!f1){clearInterval(heroTimer);return}
    k=(k+1)%pairs.length;
    f1.textContent=pairs[k][0]; f2.textContent=pairs[k][1];
    [f1,f2].forEach(e=>{e.parentElement.classList.remove('flip');void e.offsetWidth;e.parentElement.classList.add('flip')});
  },1900);
}
const go = s => { S.screen=s; render(); };

async function loadUser(nick){
  let r = null;
  try{ r = await api.result(nick); }catch(e){ console.error(e); toast('서버 연결에 문제가 있어요'); }
  if(!r) return false;
  S.nick = r.nick; S.room = r;
  S.mine = {}; [...r.mbti].forEach((c,i)=>S.mine[i]=c);
  return true;
}

/* ============================================================
   이벤트
   ============================================================ */
app.addEventListener('click', async e=>{
  const el = e.target.closest('[data-go],[data-me],[data-gs],[data-pick],[data-fill],button');
  if(!el) return;
  const id = el.id;

  if(el.dataset.fill){ S.nick = el.dataset.fill; S.hint=''; return render(); }

  if(el.dataset.go){
    if(el.dataset.go==='nick'){ S.mine={}; S.hint=''; S.nick=''; }
    if(el.dataset.go==='guess'){ S.guess={}; }
    return go(el.dataset.go);
  }
  if(el.dataset.me!==undefined){ S.mine[+el.dataset.me]=el.dataset.v; return render(); }
  if(el.dataset.gs!==undefined){ S.guess[+el.dataset.gs]=el.dataset.v; return render(); }

  if(id==='dunno'){ S.modal=true; S.qi=0; S.qs=[0,0,0,0]; return render(); }
  if(id==='closeq'){ S.modal=false; return render(); }
  if(el.dataset.pick){
    S.qs[QUIZ[S.qi][0]] += (+el.dataset.pick);
    if(++S.qi>=QUIZ.length){
      AXES.forEach((x,i)=> S.mine[i] = S.qs[i]>=0 ? x.a : x.b);
      S.modal=false; render(); toast('결과: '+mbtiOf(S.mine)+' — 마음에 안 들면 바꿔도 돼요');
      return;
    }
    return render();
  }

  if(id==='resume'){
    if(!(await loadUser(S.remembered))) { S.remembered=null; return render(); }
    return go(S.room.n ? 'result' : 'share');
  }
  if(id==='forget'){
    cookie.del('mm_nick'); S.remembered=null;
    toast('이 브라우저에서 기억을 지웠어요'); return render();
  }

  if(id==='nicknext'){
    if(!NICK_RE.test(S.nick)) return;
    if(await api.exists(S.nick)){
      S.hint = `@${S.nick} 은 이미 쓰는 사람이 있어요. 뒤에 숫자를 붙여보세요.`;
      return render();
    }
    return go('setup');
  }

  if(id==='create'){
    el.disabled = true;
    try{ await api.create(S.nick, mbtiOf(S.mine)); }
    catch(err){ el.disabled=false; return toast('만들지 못했어요. 잠시 후 다시 시도해주세요.'); }
    await loadUser(S.nick);
    cookie.set('mm_nick', S.nick);
    S.remembered = S.nick;
    return go('share');
  }

  if(id==='kshare'){
    const url = shareUrl(S.nick);
    if(kakaoShare(S.nick, url)) return;
    try{ await navigator.clipboard.writeText(url); }catch(err){}
    return toast('링크를 복사했어요 · 카톡에 붙여넣어 주세요');
  }

  if(id==='cp'){
    try{ await navigator.clipboard.writeText(shareUrl(S.nick)); }catch(err){}
    return toast('링크를 복사했어요 · ' + link(S.nick));
  }

  if(id==='dolookup'){
    const v=(document.getElementById('mynick').value||'').trim();
    if(!v) return toast('닉네임을 넣어주세요');
    if(!(await loadUser(v))) return toast(`@${v} 로 만든 테스트가 없어요.`);
    cookie.set('mm_nick', S.nick);
    S.remembered = S.nick;
    return go(S.room.n ? 'result' : 'share');
  }

  if(id==='submit'){
    el.disabled = true;
    try{ await api.vote(S.nick, mbtiOf(S.guess)); }
    catch(err){ el.disabled=false; return toast('투표를 저장하지 못했어요. 다시 눌러주세요.'); }
    await loadUser(S.nick);
    return go('reveal');
  }
});

/* ---------- 부팅 ----------
   1) 주소가 /@닉네임 이고 내 닉네임이 아니면 → 친구 추측 화면
   2) 쿠키에 기억된 닉네임이 있으면 → 내 결과로 직행
   3) 둘 다 없으면 → 첫 화면                                   */
(async function boot(){
  if(!LIVE){
    const f = document.createElement('div');
    f.className = 'demoflag';
    f.textContent = '데모 모드 · 저장되지 않습니다';
    document.body.appendChild(f);
  }

  let urlNick = new URLSearchParams(location.search).get('u') || '';
  if(!urlNick && !IS_PAGES){
    const m = location.pathname.match(/^\/@?([^\/]+)\/?$/);
    if(m) urlNick = decodeURIComponent(m[1]);
  }
  urlNick = urlNick.trim();

  const last = cookie.get('mm_nick');

  if(urlNick && urlNick.toLowerCase() !== String(last||'').toLowerCase()){
    if(await loadUser(urlNick)){
      S.guess = {}; S.screen = 'guess'; render(); return;
    }
    toast(`@${urlNick} 를 찾지 못했어요`);
  }

  if(last && await loadUser(last)){
    S.remembered = S.nick;
    S.screen = S.room.n ? 'result' : 'share';
    render(); toast(`@${S.nick} 님, 다시 오셨네요`);
    return;
  }

  if(urlNick && await loadUser(urlNick)){
    S.remembered = S.nick;
    S.screen = S.room.n ? 'result' : 'share';
    render(); return;
  }

  render();
})();
</script>
